services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      # Compose fills these in from .env next to this file; the defaults after :- apply when a variable is unset.
      POSTGRES_USER: ${POSTGRES_USER:-upahaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-upahaar_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-upahaar}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-upahaar}:${POSTGRES_PASSWORD:-upahaar_dev_password}@db:5432/${POSTGRES_DB:-upahaar}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
